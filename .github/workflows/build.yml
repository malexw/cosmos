name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libglu1-mesa-dev \
            libopenal-dev \
            libglm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Build and install SDL3
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL3
          cmake -S SDL3 -B SDL3/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build SDL3/build
          sudo cmake --install SDL3/build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-linux
          path: build/cosmos
